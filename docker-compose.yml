version: "3.9"

services:
  db:
    image: postgres:17
    container_name: HusOverblik-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HusOverblikDb
    ports:
      - "2022:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: